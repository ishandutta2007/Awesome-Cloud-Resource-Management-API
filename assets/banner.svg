<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card / Glow Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 48px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }

    .animated-bg-circle { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .card-1 { animation: floatCard1 5s ease-in-out infinite; }
    .card-2 { animation: floatCard2 6s ease-in-out infinite; }
    .data-stream { stroke-dasharray: 8, 12; animation: dashStream 2s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Glowing Background Orbs (Behind everything) -->
  <circle class="animated-bg-circle" cx="200" cy="100" r="150" fill="#6366f1" filter="url(#glow)" opacity="0.25"/>
  <circle class="animated-bg-circle" cx="1000" cy="300" r="180" fill="#ec4899" filter="url(#glow)" opacity="0.2"/>

  <!-- Dynamic Graphic Elements in Background / Sides -->
  <!-- Connecting Tech Lines -->
  <path class="data-stream" d="M 150 320 Q 300 350 450 310 T 800 330" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
  <path class="data-stream" d="M 800 80 Q 950 50 1100 120" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Floating Cards (Positioned safely around text) -->
  <g class="card-1" transform="translate(850, 70)">
    <rect width="260" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="45" r="18" fill="#0284c7" opacity="0.3"/>
    <text x="35" y="50" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#38bdf8">☁️</text>
    <text x="70" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Multi-Cloud Control</text>
    <text x="70" y="60" font-family="sans-serif" font-size="12" fill="#94a3b8">AWS • Azure • GCP</text>
  </g>

  <g class="card-2" transform="translate(870, 220)">
    <rect width="250" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="45" r="18" fill="#10b981" opacity="0.3"/>
    <text x="35" y="50" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#34d399">⚙️</text>
    <text x="70" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">IaC Automation</text>
    <text x="70" y="60" font-family="sans-serif" font-size="12" fill="#94a3b8">Terraform • Crossplane</text>
  </g>

  <!-- Foreground Content Block (Guaranteed clear visibility) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="320" height="32" rx="16" fill="url(#accentGrad)" opacity="0.2"/>
      <rect width="320" height="32" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="1.5"/>
      <text x="160" y="21" class="badge-text" text-anchor="middle">⚡ UNIFIED CLOUD RESOURCE APIs</text>
    </g>

    <!-- Main Foreground Title -->
    <text x="0" y="170" class="title">
      Awesome Cloud Resource
    </text>
    <text x="0" y="235" class="title" fill="url(#accentGrad)">
      Management API Ecosystem 🔌
    </text>

    <!-- Subtitle -->
    <text x="0" y="290" class="subtitle">
      Curated Commercial APIs &amp; Open-Source Infrastructure-as-Code Platforms
    </text>

    <!-- Decorative Accent Line -->
    <rect x="0" y="325" width="450" height="4" rx="2" fill="url(#accentGrad)"/>
  </g>
</svg>
